services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: task-tracker-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?Set DATABASE_NAME in api/.env}
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER in api/.env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in api/.env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    image: localhost/task-tracker-api:local
    container_name: task-tracker-api
    build:
      context: ./api
      dockerfile: Containerfile
    environment:
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME in api/.env}
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER in api/.env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in api/.env}
      DATABASE_SYNCHRONIZE: "true"
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    restart: unless-stopped

  web:
    image: localhost/task-tracker-web:local
    container_name: task-tracker-web
    build:
      context: ./web
      dockerfile: Containerfile
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
    external: true
    name: task-tracker-postgres-data
